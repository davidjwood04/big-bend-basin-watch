name: Basin Campground Watch

# Checks Chisos Basin Campground (Big Bend NP, recreation.gov facility ID 234038)
# for any individual night with check-in Oct 9-14, 2026 (end-date 10-15 = the
# checkout for the night of the 14th). Runs every 5 minutes and pushes an instant
# phone notification via ntfy.sh the moment a site opens up, so you can book it
# manually before anyone else does.

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min (nominal; GitHub scheduler is best-effort and often delays)
  workflow_dispatch: {}       # lets you trigger a manual check from the Actions tab

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous search state (avoids duplicate notifications)
        uses: actions/cache@v4
        with:
          path: camply_campsites.json
          key: camply-cache-${{ github.run_id }}
          restore-keys: |
            camply-cache-

      - name: Install camply
        run: pip install camply

      - name: Search Chisos Basin Campground
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        run: |
          camply campsites \
            --provider RecreationDotGov \
            --campground 234038 \
            --start-date "2026-10-09" \
            --end-date "2026-10-15" \
            --nights 1 \
            --notifications ntfy \
            --notify-first-try \
            --search-once \
            --offline-search \
            --offline-search-path camply_campsites.json

      # >>> TEMPORARY TEST STEP — delete this whole step once you've confirmed
      # notifications work. It watches the next 30 days (likely to have summer
      # openings) purely to get real alerts flowing. Its cache is NOT persisted,
      # so it will re-notify every run — expect repeat pushes until removed.
      - name: (TEMP) Near-term test search to verify notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        run: |
          camply campsites \
            --provider RecreationDotGov \
            --campground 234038 \
            --start-date "$(date -u +%Y-%m-%d)" \
            --end-date "$(date -u -d '+30 days' +%Y-%m-%d)" \
            --nights 1 \
            --notifications ntfy \
            --notify-first-try \
            --search-once
      # <<< END TEMPORARY TEST STEP
